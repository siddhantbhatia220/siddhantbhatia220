name: Sync LeetCode Submissions

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync LeetCode Activity
        uses: joshuacms/leetcode-readme-action@v1.2.0
        with:
          leetcode_username: bhatiasiddhant
          commit_message: "chore: update leetcode activity"
